    /* ==============================
       1. PENGATURAN DASAR
    ============================== */
    :root {
      --green: #176b45;
      --dark: #104b32;
      --light: #edf6ef;
      --ink: #202c25;
      --muted: #68766d;
      --white: #ffffff;
      --gold: #f4c96b;
      --border: #e5eee6;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 85px;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background-color: #f7faf7;
      background-image:
        linear-gradient(
          rgba(247, 250, 247, 0.90),
          rgba(247, 250, 247, 0.90)
        ),
        url("https://i.pinimg.com/736x/71/80/e8/7180e8335407c7faaec44b924aede881.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* ==============================
       2. HEADER DAN NAVIGASI
    ============================== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--white);
      box-shadow: 0 2px 12px #0000000c;
    }

    .nav {
      max-width: 1150px;
      margin: auto;
      padding: 17px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      color: var(--green);
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .logo span {
      color: #d99d25;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .nav-links a {
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: var(--green);
    }

    /* ==============================
       3. HERO / BERANDA
    ============================== */
    .hero {
  width: 100%;
  min-height: 300px;
  padding: 55px 22px;

  color: var(--white);
  text-align: left;

  background-image:
    linear-gradient(
      120deg,
      rgba(25, 25, 25, 0.70),
      rgba(45, 45, 45, 0.45)
    ),
    url("https://i.pinimg.com/736x/c4/2d/aa/c42daa7a8ac4745025049ea001a296b7.jpg");

  /* GAMBAR MENGIKUTI LEBAR LAYAR */
  background-size: cover;

  /* POSISI GAMBAR DI TENGAH */
  background-position: center;

  /* GAMBAR TIDAK DIULANG */
  background-repeat: no-repeat;
}

/* KONTEN HERO */
.hero-inner {
  width: 100%;
  max-width: 1100px;
  margin: auto;

  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  align-items: center;
  gap: 35px;
}

  .hero-inner {
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }

  .hero-inner > div {
    width: 550px;
    flex-shrink: 0;
  }

  .hero h1 {
    font-size: 54px;
    width: 550px;
  }

  .hero p {
    width: 550px;
  }

      flex-shrink: 0;
}


    .eyebrow {
      color: var(--gold);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
    }

      font-size: 54px;
       line-height: 1.12;
       margin: 15px 0;
    

       width: 550px;
       max-width: 100%;

      .judul-kuning {
  color: #f4c96b;
      }

      .judul-putih {
        color: #ffffff;
      }
    }

    .hero p {
      width: 550px;
       max-width: 100%;

        color: #f6f6f0;
        font-size: 15px;
        line-height: 1.8;
     }

    .primary {
      display: inline-block;
      margin-top: 12px;
      padding: 13px 19px;
      background: var(--gold);
      color: var(--dark);
      border: none;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.2s;
    }

    .primary:hover {
      background: #ffda83;
      transform: translateY(-2px);
    }

    /* ==============================
       4. BAGIAN MENU
    ============================== */
    main {
      max-width: 1100px;
      margin: 45px auto;
      padding: 0 22px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 22px;
    }

    .section-heading h2 {
      margin: 0 0 8px;
      font-size: 29px;
    }

    .section-heading p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .search {
      width: 100%;
      max-width: 270px;
      padding: 12px 14px;
      border: 1px solid #d9e4db;
      border-radius: 10px;
      outline-color: var(--green);
      background: var(--white);
    }

    .search:focus {
      border-color: var(--green);
    }

    /* ==============================
       5. FILTER KATEGORI
    ============================== */
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 25px;
    }

    .category {
      padding: 10px 16px;
      color: var(--green);
      background: var(--white);
      border: 1px solid #d9e5db;
      border-radius: 30px;
      transition: 0.2s;
    }

    .category:hover {
      background: var(--light);
    }

    .category.active {
      color: var(--white);
      background: var(--green);
      border-color: var(--green);
    }

    /* ==============================
       6. KARTU PRODUK
    ============================== */
    .products {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .product {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 5px 20px #163d2110;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px #163d2120;
    }

    .product img {
      width: 100%;
      height: 205px;
      object-fit: cover;
      background: var(--light);
    }

    .product-info {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: flex-start;
      padding: 17px;
    }

    .tag {
      display: inline-block;
      padding: 5px 9px;
      color: var(--green);
      background: var(--light);
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .product h3 {
      margin: 12px 0 8px;
      font-size: 18px;
    }

    .product p {
      min-height: 40px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .price {
      margin-top: auto;
      padding-top: 15px;
      color: var(--green);
      font-size: 17px;
      font-weight: 800;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 35px 10px;
      color: var(--muted);
      background: var(--white);
      border-radius: 14px;
      text-align: center;
    }

    /* ==============================
       7. FOOTER
       Background dan ukuran dipertahankan
    ============================== */
    footer {
      margin-top: 30px;
      padding: 18px 12px 12px;
      color: var(--white);
      text-align: center;
      background-image:
        linear-gradient(
          rgba(25, 25, 25, 0.70),
          rgba(45, 45, 45, 0.45)
        ),
        url("https://i.pinimg.com/736x/c4/2d/aa/c42daa7a8ac4745025049ea001a296b7.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

      margin-bottom: 6px;
      color: var(--white);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.3px;
      line-height: 1.3;
    }

    footer .logo span {
      color: var(--gold);
    }

    footer .footer-slogan {
      margin: 5px 0;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }

    footer .footer-description {
      margin: 7px auto 10px;
      color: var(--light);
      font-size: 11px;
      line-height: 1.5;
    }

      width: 45px;
      margin: 8px auto;
      border: 0;
      border-top: 1px solid var(--gold);
    }

    footer .copyright {
      margin: 0;
      color: #eeeeee;
      font-size: 10px;
      line-height: 1.5;
    }

    /* ==============================
       8. RESPONSIVE TABLET DAN HP
    ============================== */

      }

      }

      }

      }

      .hero-inner {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      main {
        margin-top: 35px;
        padding: 0 16px;
      }

      .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .product img {
        height: 145px;
      }

      .product-info {
        padding: 12px;
      }

      .product h3 {
        font-size: 15px;
      }

      .product p {
        font-size: 12px;
      }

      .search {
        max-width: none;
      }
    }

    @media (max-width: 400px) {
      .nav {
        flex-wrap: wrap;
      }

      .nav-links {
        gap: 15px;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .product img {
        height: 210px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

  </style>

        deskripsi: "KEJU | PANDA | ORIGINAL.",
        gambar: "https://i.pinimg.com/736x/b5/8f/db/b58fdb17119aa03ca13f359d88be7512.jpg"
      },
      {
        id: 27,
        nama: "SAUS BELIBIS 235ml",
        kategori: "Persausan",
        harga: 2040,
        deskripsi: "Dua pilihan rasa Belibis yang berbeda.",
        gambar: "https://i.pinimg.com/736x/3f/9e/af/3f9eafae23daf158d4883dfc76cd70a8.jpg"
      }
    ];

    /* ==============================
       2. PENGATURAN KATEGORI
    ============================== */

    let kategoriAktif = "Semua";

    /* ==============================
       3. FORMAT HARGA LKR
    ============================== */

    function formatHarga(angka) {
      return new Intl.NumberFormat("en-LK", {
        style: "currency",
        currency: "LKR",
        maximumFractionDigits: 0
      }).format(angka);
    }

    /* ==============================
       4. MENAMPILKAN PRODUK
    ============================== */

    function tampilkanProduk() {
      const wadah = document.getElementById("products");
      const inputCari = document.getElementById("search");

      const kata = inputCari.value.trim().toLowerCase();

      const hasil = produk.filter((item) => {
        const cocokKategori =
          kategoriAktif === "Semua" ||
          item.kategori === kategoriAktif;

        const cocokKata =
          item.nama.toLowerCase().includes(kata) ||
          item.deskripsi.toLowerCase().includes(kata);

        return cocokKategori && cocokKata;
      });

      if (hasil.length === 0) {
        wadah.innerHTML = `
          <div class="empty">
            Makanan tidak ditemukan. Coba kata kunci lain.
          </div>
        `;
        return;
      }

      wadah.innerHTML = hasil.map((item) => `
        <article class="product">

          <img
            src="${item.gambar}"
            alt="${item.nama}"
            loading="lazy"
            onerror="this.onerror=null;this.src='https://placehold.co/600x400/eaf3eb/176b45?text=Gambar+Tidak+Tersedia'">

          <div class="product-info">

            <span class="tag">${item.kategori}</span>

            <h3>${item.nama}</h3>

            <p>${item.deskripsi}</p>

            <span class="price">
              ${formatHarga(item.harga)}
            </span>

          </div>
        </article>
      `).join("");
    }

    /* ==============================
       5. FILTER KATEGORI
    ============================== */

    document
      .getElementById("categories")
      .addEventListener("click", (event) => {

        const tombol = event.target.closest(
          "button[data-category]"
        );

        if (!tombol) return;

        kategoriAktif = tombol.dataset.category;

        document.querySelectorAll(".category").forEach((item) => {
          item.classList.toggle("active", item === tombol);
        });

        tampilkanProduk();
      });

    /* ==============================
       6. PENCARIAN PRODUK
    ============================== */

    document
      .getElementById("search")
      .addEventListener("input", tampilkanProduk);

    /* ==============================
       7. TAMPILKAN PRODUK SAAT DIBUKA
    ============================== */

    tampilkanProduk();

  </script>

</body>
</html>
